services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      NODE_ENV: development
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-punto_venta}
      DB_USER: ${MYSQL_USER:-punto_venta}
      DB_PASSWORD: ${MYSQL_PASSWORD:-punto_venta_dev}
      WATCHPACK_POLLING: "true"
    command: npm run dev
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
